<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<link rel="icon" type="image/png" href="prestilon.logo.png">
<title>Email Confirmed — PRESTILON</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060f1a;--bg2:#0a1929;--bg3:#0e2035;
  --c1:#0ea5e9;--c2:#0284c7;--purple:#7c3aed;
  --text:#f0f6ff;--text2:#c8dae8;--text3:#7a9ab8;
  --border:rgba(255,255,255,.07);--border2:rgba(14,165,233,.3);
  --green:#10d48a;
}
html,body{height:100%;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);overflow:hidden}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 60% 60% at 50% 40%,rgba(16,212,138,.06),transparent 65%),
    radial-gradient(ellipse 55% 55% at 20% 70%,rgba(14,165,233,.05),transparent 60%),
    radial-gradient(ellipse 50% 50% at 80% 20%,rgba(124,58,237,.05),transparent 60%);
}
canvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.3}

@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.7)}60%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes ripple{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.2);opacity:0}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
@keyframes shimmer{to{background-position:200% center}}
@keyframes _sp{to{transform:rotate(360deg)}}
@keyframes countdown{from{stroke-dashoffset:0}to{stroke-dashoffset:126}}

nav{
  position:sticky;top:0;z-index:999;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 1.5rem 0 0;height:64px;
  background:rgba(6,15,26,.88);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-bottom:1px solid var(--border);
}
.logo{display:flex;align-items:center;text-decoration:none;transition:opacity .2s;padding-left:1rem;overflow:hidden;height:64px}
.logo:hover{opacity:.85}
.logo-img{height:44px;width:auto;mix-blend-mode:screen;display:block;object-fit:contain}

.page{
  height:calc(100vh - 64px);display:flex;align-items:center;justify-content:center;
  position:relative;z-index:1;padding:1rem;
}

.card{
  width:100%;max-width:440px;
  background:var(--bg2);border:1px solid var(--border);border-radius:20px;
  padding:2.5rem 2rem 2rem;
  box-shadow:0 30px 90px rgba(0,0,0,.55);
  text-align:center;
  animation:up .5s ease both;
}

/* Animated checkmark circle */
.check-wrap{
  position:relative;width:80px;height:80px;margin:0 auto 1.5rem;
}
.ripple{
  position:absolute;inset:0;border-radius:50%;
  border:2px solid rgba(16,212,138,.35);
  animation:ripple 1.8s ease-out infinite;
}
.ripple2{
  position:absolute;inset:0;border-radius:50%;
  border:2px solid rgba(16,212,138,.2);
  animation:ripple 1.8s ease-out .6s infinite;
}
.check-circle{
  position:relative;z-index:1;
  width:80px;height:80px;border-radius:50%;
  background:linear-gradient(135deg,rgba(16,212,138,.18),rgba(14,165,233,.12));
  border:2px solid rgba(16,212,138,.4);
  display:flex;align-items:center;justify-content:center;
  animation:pop .55s cubic-bezier(.34,1.56,.64,1) .1s both;
  box-shadow:0 0 40px rgba(16,212,138,.15);
}

.title{
  font-family:'Syne',sans-serif;font-weight:800;font-size:1.5rem;
  margin-bottom:.5rem;letter-spacing:-.02em;
}
.title .gr{
  background:linear-gradient(100deg,var(--green),var(--c1));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.subtitle{color:var(--text2);font-size:.85rem;line-height:1.7;margin-bottom:1.75rem}
.subtitle strong{color:var(--text)}

/* Auto-redirect countdown */
.countdown-wrap{
  display:flex;align-items:center;justify-content:center;gap:.65rem;
  margin-bottom:1.5rem;padding:.55rem 1rem;
  background:rgba(16,212,138,.04);border:1px solid rgba(16,212,138,.12);border-radius:10px;
}
.cd-ring{position:relative;width:28px;height:28px;flex-shrink:0}
.cd-svg{position:absolute;inset:0;transform:rotate(-90deg)}
.cd-bg{fill:none;stroke:rgba(255,255,255,.06);stroke-width:3}
.cd-fill{
  fill:none;stroke:var(--green);stroke-width:3;stroke-linecap:round;
  stroke-dasharray:126;stroke-dashoffset:0;
}
.cd-n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:.72rem;color:var(--green)}
.cd-txt{font-size:.75rem;color:var(--text2);font-family:'JetBrains Mono',monospace}

/* CTA button */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  width:100%;padding:.6rem;border-radius:11px;border:none;
  background:linear-gradient(135deg,var(--c1),var(--purple));
  color:#fff;font-family:'DM Sans',sans-serif;font-size:.9rem;font-weight:800;
  cursor:pointer;transition:all .22s;
  box-shadow:0 0 28px rgba(14,165,233,.3);
  text-decoration:none;
}
.btn:hover{box-shadow:0 0 48px rgba(14,165,233,.5);transform:translateY(-2px)}

/* Features row */
.feats{
  display:flex;justify-content:center;gap:1.2rem;margin-top:1.5rem;
  padding-top:1.2rem;border-top:1px solid var(--border);flex-wrap:wrap;
}
.feat{display:flex;align-items:center;gap:.38rem;font-size:.68rem;color:var(--text3);font-family:'JetBrains Mono',monospace}
.feat svg{color:var(--green);flex-shrink:0}
</style>
</head>
<body>
<canvas id="bg"></canvas>

<nav>
  <a class="logo" href="/"><img class="logo-img" src="/prestilon.logo.png" alt="Prestilon"></a>
</nav>

<div class="page">
  <div class="card">

    <div class="check-wrap">
      <div class="ripple"></div>
      <div class="ripple2"></div>
      <div class="check-circle">
        <svg width="34" height="34" fill="none" viewBox="0 0 24 24">
          <path stroke="#10d48a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M20 6L9 17l-5-5"/>
        </svg>
      </div>
    </div>

    <div class="title">Email <span class="gr">Confirmed!</span></div>
    <p class="subtitle">
      Your email address has been successfully verified.<br/>
      <strong>Welcome to PRESTILON</strong> — your account is now active.
    </p>

    <!-- Auto-redirect countdown -->
    <div class="countdown-wrap">
      <div class="cd-ring">
        <svg class="cd-svg" viewBox="0 0 28 28" width="28" height="28">
          <circle class="cd-bg" cx="14" cy="14" r="10"/>
          <circle class="cd-fill" id="cdArc" cx="14" cy="14" r="10"/>
        </svg>
        <div class="cd-n" id="cdNum">5</div>
      </div>
      <div class="cd-txt">Redirecting to your dashboard in <span id="cdSec">5</span>s…</div>
    </div>

    <a href="/account" class="btn" id="dashBtn">
      <svg width="15" height="15" fill="none" viewBox="0 0 24 24"><rect stroke="currentColor" stroke-width="2" stroke-linecap="round" x="2" y="3" width="20" height="14" rx="2"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M8 21h8M12 17v4"/></svg>
      Go to Dashboard
    </a>

    <div class="feats">
      <div class="feat">
        <svg width="11" height="11" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Secure account
      </div>
      <div class="feat">
        <svg width="11" height="11" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        AI engine ready
      </div>
      <div class="feat">
        <svg width="11" height="11" fill="none" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 8v4l3 3"/></svg>
        Real-time monitoring
      </div>
    </div>

  </div>
</div>

<script>
/* Canvas */
(()=>{
  const c=document.getElementById('bg'),x=c.getContext('2d');let W,H,P=[]
  function resize(){W=c.width=innerWidth;H=c.height=innerHeight}
  function init(){P=[];for(let i=0;i<50;i++)P.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.16,vy:(Math.random()-.5)*.16})}
  function draw(){
    x.clearRect(0,0,W,H)
    P.forEach((a,i)=>{
      P.slice(i+1).forEach(b=>{
        const dx=a.x-b.x,dy=a.y-b.y,d=Math.sqrt(dx*dx+dy*dy)
        if(d<115){x.beginPath();x.strokeStyle=`rgba(16,212,138,${.035*(1-d/115)})`;x.lineWidth=.5;x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}
      })
      x.beginPath();x.arc(a.x,a.y,1,0,Math.PI*2);x.fillStyle='rgba(16,212,138,.18)';x.fill()
      a.x+=a.vx;a.y+=a.vy
      if(a.x<0||a.x>W)a.vx*=-1;if(a.y<0||a.y>H)a.vy*=-1
    })
    requestAnimationFrame(draw)
  }
  window.addEventListener('resize',()=>{resize();init()})
  resize();init();draw()
})()

/* Countdown */
const TOTAL=5
const arc=document.getElementById('cdArc')
const numEl=document.getElementById('cdNum')
const secEl=document.getElementById('cdSec')
const circumference=2*Math.PI*10  // r=10

let secs=TOTAL
function tick(){
  secs--
  numEl.textContent=secs
  secEl.textContent=secs
  // Animate arc: go from full circle to empty
  const progress=(TOTAL-secs)/TOTAL
  arc.style.strokeDashoffset=circumference*progress
  if(secs<=0){
    clearInterval(timer)
    window.location.href='/account'
  }
}
// Start arc fully filled
arc.style.strokeDashoffset=0
const timer=setInterval(tick,1000)
</script>
