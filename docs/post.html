<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<link rel="icon" type="image/png" href="prestilon.logo.png">
<title>Post — PRESTILON Community</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060f1a;--bg2:#0a1929;--bg3:#0e2035;
  --c1:#00d4b4;--c2:#00a896;--purple:#6c5ce7;
  --text:#f0f6ff;--text2:#8eaabf;--text3:#3d5a70;
  --border:rgba(255,255,255,.07);--border2:rgba(0,212,180,.25);
  --red:#ef4444;--green:#10d48a;--amber:#f59e0b;
  --r:max(1.5rem,calc(50vw - 640px));
}
html{background:var(--bg);scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;color:var(--text);overflow-x:hidden;min-height:100vh}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 70% 40% at 50% -5%,rgba(0,212,180,.05),transparent 55%)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* NAV */
nav{position:sticky;top:0;z-index:999;display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem 0 0;height:64px;background:rgba(6,15,26,.9);backdrop-filter:blur(24px);border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;text-decoration:none;transition:opacity .2s;padding-left:1rem;overflow:hidden;height:64px}
.logo:hover{opacity:.85}
.logo-img{height:44px;width:auto;mix-blend-mode:screen;object-fit:contain}
.nav-r{display:flex;align-items:center;gap:.15rem}
.nl{padding:.42rem .85rem;color:var(--text2);font-size:.88rem;font-weight:500;text-decoration:none;border-radius:7px;transition:color .18s,background .18s}
.nl:hover{color:var(--text);background:rgba(255,255,255,.05)}
.nl.active{color:var(--c1)}
.nc{margin-left:.5rem;padding:.5rem 1.25rem;border-radius:8px;font-weight:700;font-size:.88rem;background:var(--c1);color:#060f1a;text-decoration:none;box-shadow:0 0 18px rgba(0,212,180,.25);transition:all .2s;display:inline-flex;align-items:center;gap:.3rem}
.nc:hover{box-shadow:0 0 30px rgba(0,212,180,.45);transform:translateY(-1px)}

/* LAYOUT */
.page{max-width:860px;margin:0 auto;padding:2.5rem var(--r) 5rem;position:relative;z-index:1}
.back-link{display:inline-flex;align-items:center;gap:.4rem;color:var(--text3);font-size:.8rem;text-decoration:none;margin-bottom:1.5rem;transition:color .18s}
.back-link:hover{color:var(--c1)}

/* POST CARD */
.post-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:2rem;margin-bottom:2rem;animation:up .4s ease both}
.post-tags{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
.tag{padding:.2rem .65rem;border-radius:99px;font-size:.65rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.tag-general{background:rgba(0,212,180,.12);color:var(--c1)}
.tag-help{background:rgba(239,68,68,.12);color:#fca5a5}
.tag-tips{background:rgba(16,212,138,.12);color:var(--green)}
.tag-bug{background:rgba(245,158,11,.12);color:var(--amber)}
.tag-feature{background:rgba(108,92,231,.12);color:#a78bfa}
.tag-showcase{background:rgba(236,72,153,.12);color:#f9a8d4}
.tag-pinned{background:rgba(0,212,180,.2);color:var(--c1);border:1px solid var(--border2)}
.post-title{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(1.3rem,3vw,1.8rem);line-height:1.25;margin-bottom:1rem}
.post-meta{display:flex;align-items:center;gap:1rem;font-size:.75rem;color:var(--text3);margin-bottom:1.5rem;flex-wrap:wrap}
.meta-author{display:flex;align-items:center;gap:.5rem}
.av{width:30px;height:30px;border-radius:50%;background:rgba(0,212,180,.15);color:var(--c1);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0}
.post-body-text{font-size:.93rem;line-height:1.8;color:var(--text2);white-space:pre-wrap;word-break:break-word}
.post-footer{display:flex;align-items:center;justify-content:space-between;margin-top:1.5rem;padding-top:1.2rem;border-top:1px solid var(--border);flex-wrap:wrap;gap:.8rem}
.post-stats{display:flex;gap:1.2rem;font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--text3)}
.pstat{display:flex;align-items:center;gap:.3rem}
.reaction-row{display:flex;gap:.5rem}
.react-btn{display:flex;align-items:center;gap:.4rem;padding:.4rem .85rem;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text2);font-family:'DM Sans',sans-serif;font-size:.78rem;font-weight:600;cursor:pointer;transition:all .18s}
.react-btn:hover{border-color:var(--border2);color:var(--c1);background:rgba(0,212,180,.06)}
.react-btn.liked{border-color:var(--c1);color:var(--c1);background:rgba(0,212,180,.1)}
.react-btn.disliked{border-color:#ef4444;color:#fca5a5;background:rgba(239,68,68,.08)}

/* COMMENTS SECTION */
.comments-section{animation:up .4s ease .1s both}
.comments-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.2rem}
.comments-title{font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;color:var(--text)}

/* COMMENT BOX */
.comment-box{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:1.2rem;margin-bottom:1.5rem}
.comment-box textarea{width:100%;padding:.7rem 1rem;border-radius:10px;background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:'DM Sans',sans-serif;font-size:.86rem;resize:vertical;min-height:80px;outline:none;transition:border-color .18s;line-height:1.6}
.comment-box textarea:focus{border-color:rgba(0,212,180,.38)}
.comment-box textarea::placeholder{color:var(--text3)}
.cb-footer{display:flex;align-items:center;justify-content:flex-end;margin-top:.7rem;gap:.6rem}
.cb-cancel{padding:.45rem .9rem;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text2);font-family:'DM Sans',sans-serif;font-size:.8rem;cursor:pointer;transition:all .15s}
.cb-cancel:hover{border-color:var(--border2);color:var(--text)}
.cb-submit{padding:.45rem 1.1rem;border-radius:8px;border:none;background:var(--c1);color:#060f1a;font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:700;cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:.35rem}
.cb-submit:hover:not(:disabled){box-shadow:0 0 18px rgba(0,212,180,.35);transform:translateY(-1px)}
.cb-submit:disabled{opacity:.5;cursor:not-allowed}
.sign-in-prompt{background:rgba(0,212,180,.04);border:1px solid var(--border2);border-radius:12px;padding:1rem 1.2rem;margin-bottom:1.5rem;font-size:.83rem;color:var(--text2);display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.sign-in-prompt a{color:var(--c1);text-decoration:none;font-weight:600}
.sign-in-prompt a:hover{text-decoration:underline}

/* COMMENT ITEM */
.comment{padding:1rem 0;border-bottom:1px solid var(--border)}
.comment:last-child{border-bottom:none}
.comment-header{display:flex;align-items:center;gap:.6rem;margin-bottom:.6rem}
.comment-author{font-size:.8rem;font-weight:600;color:var(--text)}
.comment-time{font-size:.7rem;color:var(--text3)}
.comment-body{font-size:.85rem;color:var(--text2);line-height:1.7;white-space:pre-wrap;word-break:break-word;margin-bottom:.6rem}
.comment-actions{display:flex;align-items:center;gap:.8rem}
.ca-btn{background:none;border:none;color:var(--text3);font-size:.72rem;font-family:'DM Sans',sans-serif;cursor:pointer;display:flex;align-items:center;gap:.25rem;padding:.2rem .4rem;border-radius:5px;transition:color .15s,background .15s}
.ca-btn:hover{color:var(--c1);background:rgba(0,212,180,.06)}
.ca-btn.liked{color:var(--c1)}
.ca-btn.disliked{color:#fca5a5}
.reply-thread{padding-left:1.5rem;border-left:2px solid var(--border);margin-top:.8rem}
.reply-thread .comment{padding:.8rem 0}

/* EMPTY / LOADING */
.empty-state{text-align:center;padding:2.5rem 1rem;color:var(--text3);font-size:.85rem}
.spinner-inline{width:14px;height:14px;border:2px solid rgba(0,0,0,.2);border-top-color:#060f1a;border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
.loading-comments{text-align:center;padding:2rem;color:var(--text3);font-size:.82rem}

/* TOAST */
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(80px);z-index:2000;background:var(--bg3);border:1px solid var(--border2);border-radius:12px;padding:.75rem 1.4rem;font-size:.82rem;color:var(--text);transition:transform .35s ease,opacity .35s ease;opacity:0;white-space:nowrap;max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* NOT FOUND */
.not-found{text-align:center;padding:5rem 1rem}
.not-found h2{font-family:'Syne',sans-serif;font-size:1.5rem;margin-bottom:.5rem}

/* FOOTER */
footer{border-top:1px solid var(--border);padding:2rem var(--r);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;position:relative;z-index:1}
.fc{font-size:.7rem;color:var(--text3)}
.fl-links{display:flex;gap:1.4rem;flex-wrap:wrap}
.fl-links a{color:var(--text);text-decoration:none;font-size:.74rem;transition:color .2s}
.fl-links a:hover{color:var(--text2)}

@media(max-width:640px){
  nav{padding:0 .7rem 0 0;height:48px}.logo{padding-left:.7rem;height:48px}.logo-img{height:32px}
  .nl{font-size:.68rem;padding:.2rem .32rem}.nc{padding:.3rem .6rem;font-size:.7rem;margin-left:.1rem}
  .page{padding:1.5rem 1rem 3rem}
  .post-card{padding:1.2rem}
  .reply-thread{padding-left:.8rem}
}
</style>
</head>
<body>
<nav>
  <a class="logo" href="/"><img class="logo-img" src="/prestilon.logo.png" alt="Prestilon"></a>
  <div class="nav-r">
    <a class="nl" href="/">Home</a>
    <a class="nl active" href="/community">Community</a>
    <a class="nl" href="/support">Support</a>
    <a class="nc" id="navCta" href="/login">Sign In →</a>
  </div>
</nav>

<div class="page">
  <a class="back-link" href="/community">
    <svg width="14" height="14" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Back to Community
  </a>

  <div id="postArea"><div class="loading-comments">Loading post…</div></div>
  <div id="commentsArea"></div>
</div>

<div class="toast" id="toast"></div>

<footer>
  <div class="fc">© 2026 PRESTILON. All rights reserved.</div>
  <div class="fl-links">
    <a href="/community">Community</a>
    <a href="/support">Support</a>
    <a href="/privacy">Privacy Policy</a>
    <a href="/terms">Terms of Service</a>
  </div>
</footer>

<script>
let sb, currentUser=null, postId=null, postData=null, myReaction=null

function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function timeAgo(ts){
  const d=Math.floor((Date.now()-new Date(ts))/1000)
  if(d<60)return 'just now';if(d<3600)return Math.floor(d/60)+'m ago'
  if(d<86400)return Math.floor(d/3600)+'h ago';if(d<604800)return Math.floor(d/86400)+'d ago'
  return new Date(ts).toLocaleDateString()
}
function avatarColor(i){return['rgba(0,212,180,.15)','rgba(108,92,231,.15)','rgba(16,212,138,.15)','rgba(245,158,11,.15)','rgba(239,68,68,.15)'][i%5]}
function avatarText(i){return['var(--c1)','#a78bfa','var(--green)','var(--amber)','#fca5a5'][i%5]}
function charCode(name){return(name||'?').charCodeAt(0)%5}

function showToast(msg,dur=3200){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show')
  setTimeout(()=>t.classList.remove('show'),dur)
}

function renderPost(p, reaction){
  const tags=[p.category,...(p.is_pinned?['pinned']:[])]
  const ci=charCode(p.author_username)
  document.title=p.title+' — PRESTILON Community'
  return `
  <div class="post-card">
    <div class="post-tags">${tags.map(t=>`<span class="tag tag-${t}">${t}</span>`).join('')}</div>
    <h1 class="post-title">${escHtml(p.title)}</h1>
    <div class="post-meta">
      <div class="meta-author">
        <div class="av" style="background:${avatarColor(ci)};color:${avatarText(ci)}">${(p.author_username||'?')[0].toUpperCase()}</div>
        <span>${escHtml(p.author_username||'unknown')}</span>
        ${p.author_role!=='member'?`<span style="font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--c1)">${p.author_role}</span>`:''}
      </div>
      <span>🕐 ${timeAgo(p.created_at)}</span>
      <span>👁 ${(p.view_count||0).toLocaleString()} views</span>
    </div>
    <div class="post-body-text">${escHtml(p.body)}</div>
    <div class="post-footer">
      <div class="post-stats">
        <div class="pstat"><svg width="10" height="10" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>${p.comment_count||0} comments</div>
        <div class="pstat">👍 ${p.upvotes||0} · 👎 ${p.downvotes||0}</div>
      </div>
      <div class="reaction-row">
        <button class="react-btn ${reaction==='up'?'liked':''}" id="btnUp" onclick="reactPost('up')">
          <svg width="13" height="13" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M14 9V5a3 3 0 00-3-3l-4 9v11h11.28a2 2 0 002-1.7l1.38-9a2 2 0 00-2-2.3H14z"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M7 22H4a2 2 0 01-2-2v-7a2 2 0 012-2h3"/></svg>
          <span id="upCount">${p.upvotes||0}</span>
        </button>
        <button class="react-btn ${reaction==='down'?'disliked':''}" id="btnDown" onclick="reactPost('down')">
          <svg width="13" height="13" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M10 15v4a3 3 0 003 3l4-9V2H5.72a2 2 0 00-2 1.7l-1.38 9a2 2 0 002 2.3H10z"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M17 2h2.67A2.31 2.31 0 0122 4v7a2.31 2.31 0 01-2.33 2H17"/></svg>
          <span id="downCount">${p.downvotes||0}</span>
        </button>
      </div>
    </div>
  </div>`
}

async function reactPost(dir){
  if(!currentUser){showToast('⚠️ Sign in to react');setTimeout(()=>{window.location.href='/login'},1200);return}
  const reaction=dir==='up'?'up':'down'
  if(myReaction===reaction){
    // undo
    await sb.from('reactions').delete().eq('user_id',currentUser.id).eq('target_type','post').eq('target_id',postId)
    myReaction=null
  } else {
    await sb.from('reactions').upsert({user_id:currentUser.id,target_type:'post',target_id:postId,reaction},{onConflict:'user_id,target_type,target_id'})
    myReaction=reaction
  }
  // reload counts
  const{data:p}=await sb.from('posts').select('upvotes,downvotes').eq('id',postId).single()
  if(p){
    document.getElementById('upCount').textContent=p.upvotes||0
    document.getElementById('downCount').textContent=p.downvotes||0
  }
  document.getElementById('btnUp').className='react-btn'+(myReaction==='up'?' liked':'')
  document.getElementById('btnDown').className='react-btn'+(myReaction==='down'?' disliked':'')
}

function renderCommentBox(parentId=null, onCancel=null){
  const id='cb'+(parentId||'root')
  return `
  <div class="comment-box" id="${id}" style="${parentId?'margin-top:.6rem':''}">
    <textarea placeholder="${parentId?'Write a reply…':'Join the discussion…'}" id="ta${id}" rows="${parentId?3:4}"></textarea>
    <div class="cb-footer">
      ${onCancel?`<button class="cb-cancel" onclick="${onCancel}">Cancel</button>`:''}
      <button class="cb-submit" onclick="submitComment(${parentId?parentId:'null'},'${id}')">
        <svg width="12" height="12" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2.5" stroke-linecap="round" d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        ${parentId?'Reply':'Post Comment'}
      </button>
    </div>
  </div>`
}

function renderComment(c, depth=0){
  const ci=charCode(c.author_username)
  const canReact=!!currentUser
  const myUp=c._myReaction==='up', myDown=c._myReaction==='down'
  return `
  <div class="comment" id="cmt${c.id}">
    <div class="comment-header">
      <div class="av" style="width:26px;height:26px;font-size:.68rem;background:${avatarColor(ci)};color:${avatarText(ci)}">${(c.author_username||'?')[0].toUpperCase()}</div>
      <span class="comment-author">${escHtml(c.author_username||'unknown')}</span>
      <span class="comment-time">${timeAgo(c.created_at)}</span>
      ${c.author_role!=='member'?`<span style="font-family:'JetBrains Mono',monospace;font-size:.58rem;color:var(--c1)">${c.author_role}</span>`:''}
    </div>
    <div class="comment-body">${escHtml(c.body)}</div>
    <div class="comment-actions">
      <button class="ca-btn ${myUp?'liked':''}" onclick="reactComment(${c.id},'up',this)">
        <svg width="10" height="10" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M14 9V5a3 3 0 00-3-3l-4 9v11h11.28a2 2 0 002-1.7l1.38-9a2 2 0 00-2-2.3H14z"/></svg>
        <span id="cu${c.id}">${c.upvotes||0}</span>
      </button>
      <button class="ca-btn ${myDown?'disliked':''}" onclick="reactComment(${c.id},'down',this)">
        <svg width="10" height="10" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M10 15v4a3 3 0 003 3l4-9V2H5.72a2 2 0 00-2 1.7l-1.38 9a2 2 0 002 2.3H10z"/></svg>
        <span id="cd${c.id}">${c.downvotes||0}</span>
      </button>
      ${depth<2&&currentUser?`<button class="ca-btn" onclick="showReplyBox(${c.id})">↩ Reply</button>`:''}
      ${currentUser&&currentUser.id===c.author_id?`<button class="ca-btn" style="color:var(--red);margin-left:auto" onclick="deleteComment(${c.id})">Delete</button>`:''}
    </div>
    <div id="replybox${c.id}"></div>
    ${c._replies&&c._replies.length?`<div class="reply-thread">${c._replies.map(r=>renderComment(r,depth+1)).join('')}</div>`:''}
  </div>`
}

async function reactComment(id, dir, btn){
  if(!currentUser){showToast('⚠️ Sign in to react');setTimeout(()=>{window.location.href='/login'},1200);return}
  const upBtn=document.querySelector(`#cmt${id} .ca-btn.liked, #cmt${id} .comment-actions .ca-btn:first-child`)
  // determine current state from btn classes
  const isUp=dir==='up', isDown=dir==='down'
  const wasLiked=btn.classList.contains('liked'), wasDisliked=btn.classList.contains('disliked')
  if((isUp&&wasLiked)||(isDown&&wasDisliked)){
    await sb.from('reactions').delete().eq('user_id',currentUser.id).eq('target_type','comment').eq('target_id',id)
  } else {
    await sb.from('reactions').upsert({user_id:currentUser.id,target_type:'comment',target_id:id,reaction:dir},{onConflict:'user_id,target_type,target_id'})
  }
  const{data:c}=await sb.from('comments').select('upvotes,downvotes').eq('id',id).single()
  if(c){document.getElementById('cu'+id).textContent=c.upvotes||0;document.getElementById('cd'+id).textContent=c.downvotes||0}
  // reload to reflect button states
  loadComments()
}

function showReplyBox(parentId){
  const box=document.getElementById('replybox'+parentId)
  if(box.innerHTML){box.innerHTML='';return}
  box.innerHTML=renderCommentBox(parentId,`hideReplyBox(${parentId})`)
  box.querySelector('textarea').focus()
}
function hideReplyBox(parentId){document.getElementById('replybox'+parentId).innerHTML=''}

async function submitComment(parentId, boxId){
  const ta=document.getElementById('ta'+boxId)
  const body=ta.value.trim()
  if(!body||body.length<2){showToast('⚠️ Comment is too short');return}
  const btn=document.querySelector(`#${boxId} .cb-submit`)
  btn.disabled=true;btn.innerHTML='<span class="spinner-inline"></span>'
  const payload={post_id:postId,author_id:currentUser.id,body}
  if(parentId) payload.parent_id=parentId
  const{error}=await sb.from('comments').insert(payload)
  btn.disabled=false;btn.innerHTML=parentId?'↩ Reply':'Post Comment'
  if(error){showToast('❌ '+error.message);return}
  ta.value=''
  if(parentId) hideReplyBox(parentId)
  showToast('✅ Comment posted!')
  loadComments()
}

async function deleteComment(id){
  if(!confirm('Delete this comment?'))return
  await sb.from('comments').update({is_deleted:true}).eq('id',id)
  showToast('🗑 Comment deleted')
  loadComments()
}

async function loadComments(){
  const area=document.getElementById('commentsArea')
  // fetch all comments for this post
  const{data:comments}=await sb.from('comments_with_author')
    .select('*').eq('post_id',postId).order('created_at',{ascending:true})
  if(!comments){area.querySelector('#commentsList').innerHTML='<div class="empty-state">Failed to load comments.</div>';return}

  // fetch my reactions to comments
  let myReactions={}
  if(currentUser){
    const ids=comments.map(c=>c.id)
    if(ids.length){
      const{data:reacts}=await sb.from('reactions').select('target_id,reaction')
        .eq('user_id',currentUser.id).eq('target_type','comment').in('target_id',ids)
      if(reacts) reacts.forEach(r=>myReactions[r.target_id]=r.reaction)
    }
  }

  // build tree
  const map={}, roots=[]
  comments.forEach(c=>{c._replies=[];c._myReaction=myReactions[c.id]||null;map[c.id]=c})
  comments.forEach(c=>{
    if(c.parent_id&&map[c.parent_id]) map[c.parent_id]._replies.push(c)
    else if(!c.parent_id) roots.push(c)
  })

  const list=document.getElementById('commentsList')
  if(roots.length===0){
    list.innerHTML='<div class="empty-state">No comments yet. Be the first to reply!</div>'
  } else {
    list.innerHTML=roots.map(c=>renderComment(c,0)).join('')
  }
  // update count
  const el=document.getElementById('commentsCountLabel')
  if(el) el.textContent=comments.length+' Comment'+(comments.length!==1?'s':'')
}

async function init(){
  // get post id from URL
  const params=new URLSearchParams(window.location.search)
  postId=parseInt(params.get('id'))
  if(!postId||isNaN(postId)){
    document.getElementById('postArea').innerHTML='<div class="not-found"><h2>Post not found</h2><p style="color:var(--text3);margin:.5rem 0 1.5rem">This post may have been deleted or doesn\'t exist.</p><a href="/community" style="color:var(--c1);text-decoration:none">← Back to Community</a></div>'
    return
  }

  // record view (upsert = one per user)
  sb.from('post_views').upsert({post_id:postId,viewer_id:currentUser?.id||null},{onConflict:'post_id,viewer_id',ignoreDuplicates:true})

  // load post
  const{data:p,error}=await sb.from('posts_with_author').select('*').eq('id',postId).single()
  if(error||!p){
    document.getElementById('postArea').innerHTML='<div class="not-found"><h2>Post not found</h2><p style="color:var(--text3);margin:.5rem 0 1.5rem">This post may have been deleted.</p><a href="/community" style="color:var(--c1);text-decoration:none">← Back to Community</a></div>'
    return
  }
  postData=p

  // check my reaction to post
  let myR=null
  if(currentUser){
    const{data:r}=await sb.from('reactions').select('reaction').eq('user_id',currentUser.id).eq('target_type','post').eq('target_id',postId).single()
    if(r) myR=r.reaction
  }
  myReaction=myR

  document.getElementById('postArea').innerHTML=renderPost(p, myR)

  // render comments section
  document.getElementById('commentsArea').innerHTML=`
    <div class="comments-section">
      <div class="comments-header">
        <div class="comments-title" id="commentsCountLabel">Comments</div>
      </div>
      ${currentUser
        ? renderCommentBox(null, null)
        : `<div class="sign-in-prompt">💬 <span><a href="/login">Sign in</a> to join the discussion</span></div>`
      }
      <div id="commentsList"><div class="loading-comments">Loading comments…</div></div>
    </div>`

  await loadComments()
}
</script>
