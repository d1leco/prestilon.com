<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<link rel="icon" type="image/png" href="prestilon.logo.png">
<title>Post — PRESTILON Community</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060f1a;--bg2:#0a1929;--bg3:#0e2035;
  --c1:#00d4b4;--c2:#00a896;--purple:#6c5ce7;
  --text:#f0f6ff;--text2:#8eaabf;--text3:#3d5a70;
  --border:rgba(255,255,255,.07);--border2:rgba(0,212,180,.25);
  --red:#ef4444;--green:#10d48a;--amber:#f59e0b;
  --r:max(1.5rem,calc(50vw - 660px));
}
html{background:var(--bg);scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;color:var(--text);overflow-x:hidden;min-height:100vh;padding-bottom:52px}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 70% 40% at 50% -5%,rgba(0,212,180,.05),transparent 55%)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* NAV */
nav{position:sticky;top:0;z-index:999;display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem 0 0;height:52px;background:rgba(6,15,26,.9);backdrop-filter:blur(24px);border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;text-decoration:none;transition:opacity .2s;padding-left:1rem;overflow:hidden;height:52px}
.logo:hover{opacity:.85}
.logo-img{height:34px;width:auto;mix-blend-mode:screen;object-fit:contain}
.nav-r{display:flex;align-items:center;gap:.15rem}
.nl{padding:.3rem .65rem;color:var(--text2);font-size:.8rem;font-weight:500;text-decoration:none;border-radius:7px;transition:color .18s,background .18s}
.nl:hover{color:var(--text);background:rgba(255,255,255,.05)}
.nl.active{color:var(--c1)}
.nc{margin-left:.4rem;padding:.38rem .95rem;border-radius:7px;font-weight:700;font-size:.8rem;background:var(--c1);color:#060f1a;text-decoration:none;box-shadow:0 0 18px rgba(0,212,180,.25);transition:all .2s;display:inline-flex;align-items:center;gap:.3rem}
.nc:hover{box-shadow:0 0 30px rgba(0,212,180,.45);transform:translateY(-1px)}

/* LAYOUT */
.page{max-width:860px;margin:0 auto;padding:2.5rem var(--r) 5rem;position:relative;z-index:1}
.back-link{display:inline-flex;align-items:center;gap:.4rem;color:var(--text3);font-size:.8rem;text-decoration:none;margin-bottom:1.5rem;transition:color .18s}
.back-link:hover{color:var(--c1)}

/* POST CARD */
.post-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:2rem;margin-bottom:2rem;animation:up .4s ease both}
.post-tags{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
.tag{padding:.2rem .65rem;border-radius:99px;font-size:.65rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.tag-general{background:rgba(0,212,180,.12);color:var(--c1)}
.tag-help{background:rgba(239,68,68,.12);color:#fca5a5}
.tag-tips{background:rgba(16,212,138,.12);color:var(--green)}
.tag-bug{background:rgba(245,158,11,.12);color:var(--amber)}
.tag-feature{background:rgba(108,92,231,.12);color:#a78bfa}
.tag-showcase{background:rgba(236,72,153,.12);color:#f9a8d4}
.tag-pinned{background:rgba(0,212,180,.2);color:var(--c1);border:1px solid var(--border2)}
.post-title{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(1.3rem,3vw,1.8rem);line-height:1.25;margin-bottom:1rem}
.post-meta{display:flex;align-items:center;gap:1rem;font-size:.75rem;color:var(--text3);margin-bottom:1.5rem;flex-wrap:wrap}
.meta-author{display:flex;align-items:center;gap:.5rem}
.av{width:30px;height:30px;border-radius:50%;background:rgba(0,212,180,.15);color:var(--c1);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0}
.post-body-text{font-size:.93rem;line-height:1.8;color:var(--text2);white-space:pre-wrap;word-break:break-word}
.post-footer{display:flex;align-items:center;justify-content:space-between;margin-top:1.5rem;padding-top:1.2rem;border-top:1px solid var(--border);flex-wrap:wrap;gap:.8rem}
.post-stats{display:flex;gap:1.2rem;font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--text3)}
.pstat{display:flex;align-items:center;gap:.3rem}
.reaction-row{display:flex;gap:.5rem}
.react-btn{display:flex;align-items:center;gap:.4rem;padding:.4rem .85rem;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text2);font-family:'DM Sans',sans-serif;font-size:.78rem;font-weight:600;cursor:pointer;transition:all .18s}
.react-btn:hover{border-color:var(--border2);color:var(--c1);background:rgba(0,212,180,.06)}
.react-btn.liked{border-color:var(--c1);color:var(--c1);background:rgba(0,212,180,.1)}
.react-btn.disliked{border-color:#ef4444;color:#fca5a5;background:rgba(239,68,68,.08)}

/* COMMENTS SECTION */
.comments-section{animation:up .4s ease .1s both}
.comments-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.2rem}
.comments-title{font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;color:var(--text)}

/* COMMENT BOX */
.comment-box{background:transparent;border:1px solid var(--border);border-radius:12px;padding:.75rem 1rem;margin-bottom:1rem;overflow:hidden}
.comment-box .cb-header{font-size:.72rem;color:var(--text3);margin-bottom:.4rem;font-family:'JetBrains Mono',monospace}
.comment-box textarea{width:100%;padding:.3rem 0;background:transparent;border:none;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.88rem;resize:none;min-height:0;outline:none;line-height:1.6}
.comment-box textarea::placeholder{color:var(--text3)}
.cb-footer{display:flex;align-items:center;justify-content:space-between;margin-top:.5rem;gap:.5rem;border-top:1px solid var(--border);padding-top:.5rem}
.cb-footer-hint{font-size:.72rem;color:var(--text3);font-family:'JetBrains Mono',monospace}
.cb-cancel{padding:.45rem .9rem;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text2);font-family:'DM Sans',sans-serif;font-size:.8rem;cursor:pointer;transition:all .15s}
.cb-cancel:hover{border-color:var(--border2);color:var(--text)}
.cb-submit{padding:.45rem 1.1rem;border-radius:8px;border:none;background:var(--c1);color:#060f1a;font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:700;cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:.35rem}
.cb-submit:hover:not(:disabled){box-shadow:0 0 18px rgba(0,212,180,.35);transform:translateY(-1px)}
.cb-submit:disabled{opacity:.5;cursor:not-allowed}
.sign-in-prompt{background:rgba(0,212,180,.04);border:1px solid var(--border2);border-radius:12px;padding:1rem 1.2rem;margin-bottom:1.5rem;font-size:.83rem;color:var(--text2);display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.sign-in-prompt a{color:var(--c1);text-decoration:none;font-weight:600}
.sign-in-prompt a:hover{text-decoration:underline}

/* COMMENT ITEM */
.comment{padding:.75rem 0;border-bottom:1px solid var(--border)}
.comment:last-child{border-bottom:none}
.comment-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem}
.comment-author{font-size:.8rem;font-weight:600;color:var(--text)}
.comment-time{font-size:.68rem;color:var(--text3)}
.comment-body{font-size:.85rem;color:var(--text2);line-height:1.7;white-space:pre-wrap;word-break:break-word;margin-bottom:.45rem}
.comment-actions{display:flex;align-items:center;gap:.15rem;flex-wrap:wrap}
.ca-btn{background:none;border:none;color:var(--text3);font-size:.72rem;font-family:'DM Sans',sans-serif;cursor:pointer;display:flex;align-items:center;gap:.25rem;padding:.25rem .5rem;border-radius:5px;transition:color .15s,background .15s;white-space:nowrap}
.ca-btn:hover{color:var(--text);background:rgba(255,255,255,.06)}
.ca-btn.liked{color:var(--c1)}
.ca-btn.disliked{color:#fca5a5}
.ca-btn.saved{color:var(--amber)}
.vote-group{display:flex;align-items:center;gap:0;background:rgba(255,255,255,.04);border-radius:99px;overflow:hidden;border:1px solid var(--border)}
.vote-group .ca-btn{padding:.22rem .6rem;border-radius:0}
.vote-sep{width:1px;height:16px;background:var(--border)}
.ca-dots{position:relative}
.dots-menu{position:absolute;bottom:calc(100% + 6px);right:0;z-index:1000;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:.3rem;min-width:160px;box-shadow:0 -4px 24px rgba(0,0,0,.5);display:none}
.dots-menu.open{display:block}
.dots-item{display:flex;align-items:center;gap:.6rem;padding:.45rem .75rem;border-radius:7px;font-size:.78rem;color:var(--text2);cursor:pointer;transition:background .15s,color .15s;white-space:nowrap}
.dots-item:hover{background:rgba(255,255,255,.06);color:var(--text)}
.dots-item.danger{color:#fca5a5}
.dots-item.danger:hover{background:rgba(239,68,68,.08)}
.reply-thread{padding-left:1.2rem;border-left:2px solid var(--border);margin-top:.6rem}
.reply-thread .comment{padding:.6rem 0}

/* EMPTY / LOADING */
.empty-state{text-align:center;padding:2.5rem 1rem;color:var(--text3);font-size:.85rem}
.spinner-inline{width:14px;height:14px;border:2px solid rgba(0,0,0,.2);border-top-color:#060f1a;border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
.loading-comments{text-align:center;padding:2rem;color:var(--text3);font-size:.82rem}

/* TOAST */
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(80px);z-index:2000;background:var(--bg3);border:1px solid var(--border2);border-radius:12px;padding:.75rem 1.4rem;font-size:.82rem;color:var(--text);transition:transform .35s ease,opacity .35s ease;opacity:0;white-space:nowrap;max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* NOT FOUND */
.not-found{text-align:center;padding:5rem 1rem}
.not-found h2{font-family:'Syne',sans-serif;font-size:1.5rem;margin-bottom:.5rem}

/* FOOTER */
body{padding-bottom:44px}
footer{
  position:fixed!important;bottom:0;left:0;right:0;z-index:998;
  background:rgba(6,15,26,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--border);
  padding:.4rem var(--r);
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem;
}
.fc{font-size:.7rem;color:var(--text3);font-family:'JetBrains Mono',monospace}
.footer-links{display:flex;gap:1.2rem;flex-wrap:wrap}
.footer-links a{font-size:.72rem;color:var(--text2);text-decoration:none;transition:color .18s}
.footer-links a:hover{color:var(--text)}
.footer-links a[href="/community"]{color:var(--green)}

@media(max-width:640px){
  nav{padding:0 .6rem 0 0;height:44px}.logo{padding-left:.6rem;height:44px}.logo-img{height:28px}
  .nl{font-size:.65rem;padding:.18rem .28rem}.nc{padding:.25rem .5rem;font-size:.65rem;margin-left:.1rem}
  .page{padding:1.5rem 1rem 3rem}
  .post-card{padding:1.2rem}
  .reply-thread{padding-left:.8rem}
}

/* ── MOBILE NAV ── */
.ham{display:none;flex-direction:column;justify-content:center;gap:5px;width:36px;height:36px;background:none;border:none;cursor:pointer;padding:4px;border-radius:7px;transition:background .18s;flex-shrink:0}
.ham:hover{background:rgba(255,255,255,.07)}
.ham span{display:block;width:20px;height:2px;background:var(--text2);border-radius:2px;transition:all .25s;transform-origin:center}
.mob-menu{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:1000;background:rgba(6,15,26,.97);backdrop-filter:blur(24px);flex-direction:column;align-items:center;justify-content:center;gap:1.5rem}
.mob-menu.open{display:flex}
.mob-menu a{font-family:'Syne',sans-serif;font-weight:700;font-size:1.4rem;color:var(--text2);text-decoration:none;transition:color .18s}
.mob-menu a:hover{color:var(--c1)}
.mob-menu a.mob-cta{color:#060f1a;background:var(--c1);padding:.6rem 2rem;border-radius:10px;box-shadow:0 0 24px rgba(0,212,180,.3)}
.mob-close{position:absolute;top:1.1rem;right:1.1rem;background:none;border:none;color:var(--text2);font-size:1.5rem;cursor:pointer;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:8px;transition:background .18s}
.mob-close:hover{background:rgba(255,255,255,.07)}
@media(max-width:640px){
  .ham{display:flex}
  .nav-r .nl{display:none}
  .nav-r .nc{display:none}
  .nav-r{gap:0}
}
</style>
</head>
<body>
<nav>
  <a class="logo" href="/"><img class="logo-img" src="/prestilon.logo.png" alt="Prestilon"></a>
  <div class="nav-r">
    <a class="nl" href="/">Home</a>
    <a class="nl" href="/docs">Docs</a>
    <a class="nl active" href="/community">Community</a>
    <a class="nl" href="/pricing">Pricing</a>
    <a class="nl" href="/support">Support</a>
    <a class="nc" id="navCta" href="/login">Sign In →</a>
  
    <button class="ham" onclick="openMob()" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
</nav>
<script>(()=>{try{const s=localStorage.getItem('sb-ryftlimrjhhoymyfzusq-auth-token');if(s){const p=JSON.parse(s);if(p?.access_token){const el=document.getElementById('navCta');if(el){el.textContent='Dashboard →';el.href='/account'}}}}catch(e){}})();</script>

<div class="page">
  <a class="back-link" href="/community">
    <svg width="14" height="14" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Back to Community
  </a>

  <div id="postArea"><div class="loading-comments">Loading post…</div></div>
  <div id="commentsArea"></div>
</div>

<div class="toast" id="toast"></div>

<script>
let sb, currentUser=null, postId=null, postData=null, myReaction=null

function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function timeAgo(ts){
  const d=Math.floor((Date.now()-new Date(ts))/1000)
  if(d<60)return 'just now';if(d<3600)return Math.floor(d/60)+'m ago'
  if(d<86400)return Math.floor(d/3600)+'h ago';if(d<604800)return Math.floor(d/86400)+'d ago'
  return new Date(ts).toLocaleDateString()
}
function avatarColor(i){return['rgba(0,212,180,.15)','rgba(108,92,231,.15)','rgba(16,212,138,.15)','rgba(245,158,11,.15)','rgba(239,68,68,.15)'][i%5]}
function avatarText(i){return['var(--c1)','#a78bfa','var(--green)','var(--amber)','#fca5a5'][i%5]}
function charCode(name){return(name||'?').charCodeAt(0)%5}

function showToast(msg,dur=3200){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show')
  setTimeout(()=>t.classList.remove('show'),dur)
}

function renderPost(p, reaction){
  const tags=[p.category,...(p.is_pinned?['pinned']:[])]
  const ci=charCode(p.author_username)
  document.title=p.title+' — PRESTILON Community'
  return `
  <div class="post-card">
    <div class="post-tags">${tags.map(t=>`<span class="tag tag-${t}">${t}</span>`).join('')}</div>
    <h1 class="post-title">${escHtml(p.title)}</h1>
    <div class="post-meta">
      <div class="meta-author">
        <div class="av" style="background:${avatarColor(ci)};color:${avatarText(ci)}">${(p.author_username||'?')[0].toUpperCase()}</div>
        <span>${escHtml(p.author_username||'unknown')}</span>
        ${p.author_role!=='member'?`<span style="font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--c1)">${p.author_role}</span>`:''}
      </div>
      <span>🕐 ${timeAgo(p.created_at)}</span>
      <span>👁 ${(p.view_count||0).toLocaleString()} views</span>
    </div>
    <div class="post-body-text">${escHtml(p.body)}</div>
    <div class="post-footer">
      <div class="post-stats">
        <div class="pstat"><svg width="10" height="10" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>${p.comment_count||0} comments</div>
        <div class="pstat">👍 ${p.upvotes||0} · 👎 ${p.downvotes||0}</div>
      </div>
      <div class="reaction-row">
        <button class="react-btn ${reaction==='up'?'liked':''}" id="btnUp" onclick="reactPost('up')">
          <svg width="13" height="13" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M14 9V5a3 3 0 00-3-3l-4 9v11h11.28a2 2 0 002-1.7l1.38-9a2 2 0 00-2-2.3H14z"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M7 22H4a2 2 0 01-2-2v-7a2 2 0 012-2h3"/></svg>
          <span id="upCount">${p.upvotes||0}</span>
        </button>
        <button class="react-btn ${reaction==='down'?'disliked':''}" id="btnDown" onclick="reactPost('down')">
          <svg width="13" height="13" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M10 15v4a3 3 0 003 3l4-9V2H5.72a2 2 0 00-2 1.7l-1.38 9a2 2 0 002 2.3H10z"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M17 2h2.67A2.31 2.31 0 0122 4v7a2.31 2.31 0 01-2.33 2H17"/></svg>
          <span id="downCount">${p.downvotes||0}</span>
        </button>
      </div>
    </div>
  </div>`
}

async function reactPost(dir){
  if(!currentUser){showToast('⚠️ Sign in to react');setTimeout(()=>{window.location.href='/login'},1200);return}
  const reaction=dir==='up'?'up':'down'
  if(myReaction===reaction){
    // undo
    await sb.from('reactions').delete().eq('user_id',currentUser.id).eq('target_type','post').eq('target_id',postId)
    myReaction=null
  } else {
    await sb.from('reactions').upsert({user_id:currentUser.id,target_type:'post',target_id:postId,reaction},{onConflict:'user_id,target_type,target_id'})
    myReaction=reaction
  }
  // reload counts
  const{data:p}=await sb.from('posts').select('upvotes,downvotes').eq('id',postId).single()
  if(p){
    document.getElementById('upCount').textContent=p.upvotes||0
    document.getElementById('downCount').textContent=p.downvotes||0
  }
  document.getElementById('btnUp').className='react-btn'+(myReaction==='up'?' liked':'')
  document.getElementById('btnDown').className='react-btn'+(myReaction==='down'?' disliked':'')
}

function renderCommentBox(parentId=null, onCancel=null, replyToName=null){
  const id='cb'+(parentId||'root')
  const header=parentId&&replyToName?`<div class="cb-header">Reply to u/${escHtml(replyToName)}</div>`:''
  const placeholder=parentId?'Aa':'Join the discussion…'
  return `
  <div class="comment-box" id="${id}" style="${parentId?'margin-top:.5rem':''}">
    ${header}
    <textarea placeholder="${placeholder}" id="ta${id}" rows="2"></textarea>
    <div class="cb-footer">
      <div class="cb-footer-hint">${parentId?'':'Markdown supported'}</div>
      <div style="display:flex;gap:.4rem">
        ${onCancel?`<button class="cb-cancel" onclick="${onCancel}">Cancel</button>`:''}
        <button class="cb-submit" onclick="submitComment(${parentId?parentId:'null'},'${id}')">
          ${parentId?'Comment':'Post Comment'}
        </button>
      </div>
    </div>
  </div>`
}

function renderComment(c, depth=0){
  const ci=charCode(c.author_username)
  const myUp=c._myReaction==='up', myDown=c._myReaction==='down'
  const isSaved=c._saved||false
  const isFollowed=c._followed||false
  const score=(c.upvotes||0)-(c.downvotes||0)
  return `
  <div class="comment" id="cmt${c.id}">
    <div class="comment-header">
      <div class="av" style="width:24px;height:24px;font-size:.65rem;background:${avatarColor(ci)};color:${avatarText(ci)}">${(c.author_username||'?')[0].toUpperCase()}</div>
      <span class="comment-author">${escHtml(c.author_username||'unknown')}</span>
      ${c.author_role!=='member'?`<span style="font-family:'JetBrains Mono',monospace;font-size:.58rem;padding:.1rem .4rem;background:rgba(0,212,180,.1);border-radius:4px;color:var(--c1)">${c.author_role}</span>`:''}
      <span class="comment-time">· ${timeAgo(c.created_at)}</span>
    </div>
    <div class="comment-body">${escHtml(c.body)}</div>
    <div class="comment-actions">
      <div class="vote-group">
        <button class="ca-btn ${myUp?'liked':''}" onclick="reactComment(${c.id},'up')" title="Upvote">
          <svg width="11" height="11" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
        <span style="font-size:.72rem;color:${score>0?'var(--c1)':score<0?'#fca5a5':'var(--text3)'};padding:0 .25rem;font-family:'JetBrains Mono',monospace" id="cs${c.id}">${score}</span>
        <div class="vote-sep"></div>
        <button class="ca-btn ${myDown?'disliked':''}" onclick="reactComment(${c.id},'down')" title="Downvote">
          <svg width="11" height="11" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M12 5v14M5 12l7 7 7-7"/></svg>
        </button>
      </div>
      ${depth<2&&currentUser?`<button class="ca-btn" onclick="showReplyBox(${c.id},'${escHtml(c.author_username||'')}')">
        <svg width="11" height="11" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        Reply
      </button>`:''}
      <button class="ca-btn" onclick="shareComment(${c.id})">
        <svg width="11" height="11" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8M16 6l-4-4-4 4M12 2v13"/></svg>
        Share
      </button>
      ${currentUser?`<div class="ca-dots" id="dots${c.id}">
        <button class="ca-btn" onclick="toggleDotsMenu(${c.id},event)">
          <svg width="13" height="13" fill="currentColor" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
        </button>
        <div class="dots-menu" id="dotsMenu${c.id}">
          <div class="dots-item" onclick="followComment(${c.id})">
            <svg width="13" height="13" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg>
            ${isFollowed?'Unfollow comment':'Follow comment'}
          </div>
          <div class="dots-item" onclick="saveItem('comment',${c.id})">
            <svg width="13" height="13" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
            ${isSaved?'Unsave':'Save'}
          </div>
          <div class="dots-item danger" onclick="reportItem('comment',${c.id})">
            <svg width="13" height="13" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1zM4 22v-7"/></svg>
            Report
          </div>
          ${currentUser&&currentUser.id===c.author_id?`<div class="dots-item danger" onclick="deleteComment(${c.id})">
            <svg width="13" height="13" fill="none" viewBox="0 0 24 24"><polyline stroke="currentColor" stroke-width="2" stroke-linecap="round" points="3 6 5 6 21 6"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
            Delete
          </div>`:''}
        </div>
      </div>`:''}
    </div>
    <div id="replybox${c.id}"></div>
    ${c._replies&&c._replies.length?`<div class="reply-thread">${c._replies.map(r=>renderComment(r,depth+1)).join('')}</div>`:''}
  </div>`
}

async function reactComment(id, dir){
  if(!currentUser){showToast('⚠️ Sign in to react');setTimeout(()=>{window.location.href='/login'},1200);return}
  const scoreEl=document.getElementById('cs'+id)
  const upBtn=document.querySelector(`#cmt${id} .vote-group .ca-btn:first-child`)
  const downBtn=document.querySelector(`#cmt${id} .vote-group .ca-btn:last-child`)
  const wasUp=upBtn&&upBtn.classList.contains('liked')
  const wasDown=downBtn&&downBtn.classList.contains('disliked')
  if((dir==='up'&&wasUp)||(dir==='down'&&wasDown)){
    await sb.from('reactions').delete().eq('user_id',currentUser.id).eq('target_type','comment').eq('target_id',id)
  } else {
    await sb.from('reactions').upsert({user_id:currentUser.id,target_type:'comment',target_id:id,reaction:dir},{onConflict:'user_id,target_type,target_id'})
  }
  const{data:c}=await sb.from('comments').select('upvotes,downvotes').eq('id',id).single()
  if(c&&scoreEl){
    const s=(c.upvotes||0)-(c.downvotes||0)
    scoreEl.textContent=s
    scoreEl.style.color=s>0?'var(--c1)':s<0?'#fca5a5':'var(--text3)'
  }
  if(upBtn) upBtn.classList.toggle('liked',dir==='up'&&!wasUp)
  if(downBtn) downBtn.classList.toggle('disliked',dir==='down'&&!wasDown)
}

function toggleDotsMenu(id, e){
  e.stopPropagation()
  document.querySelectorAll('.dots-menu.open').forEach(m=>{
    if(m.id!=='dotsMenu'+id) m.classList.remove('open')
  })
  document.getElementById('dotsMenu'+id)?.classList.toggle('open')
}
document.addEventListener('click',()=>document.querySelectorAll('.dots-menu.open').forEach(m=>m.classList.remove('open')))

function shareComment(id){
  const url=window.location.origin+window.location.pathname+'?id='+postId+'#cmt'+id
  navigator.clipboard.writeText(url).then(()=>showToast('🔗 Link copied!'))
}

async function followComment(id){
  if(!currentUser){showToast('⚠️ Sign in first');return}
  let existing=null
  try{const{data:e}=await sb.from('followed_comments').select('id').eq('user_id',currentUser.id).eq('comment_id',id).single();existing=e}catch(e){showToast('⚠️ Run the SQL first!');return}
  if(existing){
    await sb.from('followed_comments').delete().eq('user_id',currentUser.id).eq('comment_id',id)
    showToast('🔕 Unfollowed comment')
  } else {
    await sb.from('followed_comments').insert({user_id:currentUser.id,comment_id:id})
    showToast('🔔 Following comment')
  }
  document.getElementById('dotsMenu'+id)?.classList.remove('open')
  loadComments()
}

async function saveItem(type, id){
  if(!currentUser){showToast('⚠️ Sign in first');return}
  const{data:existing}=await sb.from('saved_items').select('id').eq('user_id',currentUser.id).eq('target_type',type).eq('target_id',id).single()
  if(existing){
    await sb.from('saved_items').delete().eq('user_id',currentUser.id).eq('target_type',type).eq('target_id',id)
    showToast('🗑 Removed from saved')
  } else {
    await sb.from('saved_items').insert({user_id:currentUser.id,target_type:type,target_id:id})
    showToast('🔖 Saved!')
  }
  document.getElementById('dotsMenu'+id)?.classList.remove('open')
  loadComments()
}

async function reportItem(type, id){
  if(!currentUser){showToast('⚠️ Sign in first');return}
  const reason=prompt('Why are you reporting this? (optional)')
  if(reason===null)return
  const{error}=await sb.from('reports').insert({reporter_id:currentUser.id,target_type:type,target_id:id,reason:reason||null})
  if(error&&error.code==='23505'){showToast('⚠️ Already reported');return}
  showToast('🚩 Reported — thank you')
  document.getElementById('dotsMenu'+id)?.classList.remove('open')
}

function showReplyBox(parentId, authorName=''){
  const box=document.getElementById('replybox'+parentId)
  if(box.innerHTML){box.innerHTML='';return}
  box.innerHTML=renderCommentBox(parentId,`hideReplyBox(${parentId})`,authorName)
  box.querySelector('textarea').focus()
}
function hideReplyBox(parentId){document.getElementById('replybox'+parentId).innerHTML=''}

async function submitComment(parentId, boxId){
  const ta=document.getElementById('ta'+boxId)
  const body=ta.value.trim()
  if(!body||body.length<2){showToast('⚠️ Comment is too short');return}
  const btn=document.querySelector(`#${boxId} .cb-submit`)
  btn.disabled=true;btn.innerHTML='<span class="spinner-inline"></span>'
  const payload={post_id:postId,author_id:currentUser.id,body}
  if(parentId) payload.parent_id=parentId
  const{error}=await sb.from('comments').insert(payload)
  btn.disabled=false;btn.innerHTML=parentId?'↩ Reply':'Post Comment'
  if(error){showToast('❌ '+error.message);return}
  ta.value=''
  if(parentId) hideReplyBox(parentId)
  showToast('✅ Comment posted!')
  loadComments()
}

async function deleteComment(id){
  if(!confirm('Delete this comment?'))return
  await sb.from('comments').update({is_deleted:true}).eq('id',id)
  showToast('🗑 Comment deleted')
  loadComments()
}

async function loadComments(){
  const area=document.getElementById('commentsArea')
  // fetch all comments for this post
  const{data:comments}=await sb.from('comments_with_author')
    .select('*').eq('post_id',postId).order('created_at',{ascending:true})
  if(!comments){area.querySelector('#commentsList').innerHTML='<div class="empty-state">Failed to load comments.</div>';return}

  // fetch my reactions, saves, follows for comments
  let myReactions={}, mySaves={}, myFollows={}
  if(currentUser){
    const ids=comments.map(c=>c.id)
    if(ids.length){
      try{
        const[{data:reacts},{data:saves},{data:follows}]=await Promise.all([
          sb.from('reactions').select('target_id,reaction').eq('user_id',currentUser.id).eq('target_type','comment').in('target_id',ids),
          sb.from('saved_items').select('target_id').eq('user_id',currentUser.id).eq('target_type','comment').in('target_id',ids),
          sb.from('followed_comments').select('comment_id').eq('user_id',currentUser.id).in('comment_id',ids)
        ])
        if(reacts) reacts.forEach(r=>myReactions[r.target_id]=r.reaction)
        if(saves) saves.forEach(s=>mySaves[s.target_id]=true)
        if(follows) follows.forEach(f=>myFollows[f.comment_id]=true)
      }catch(e){
        // tables may not exist yet, reactions only
        const{data:reacts}=await sb.from('reactions').select('target_id,reaction').eq('user_id',currentUser.id).eq('target_type','comment').in('target_id',ids)
        if(reacts) reacts.forEach(r=>myReactions[r.target_id]=r.reaction)
      }
    }
  }

  // build tree
  const map={}, roots=[]
  comments.forEach(c=>{c._replies=[];c._myReaction=myReactions[c.id]||null;c._saved=mySaves[c.id]||false;c._followed=myFollows[c.id]||false;map[c.id]=c})
  comments.forEach(c=>{
    if(c.parent_id&&map[c.parent_id]) map[c.parent_id]._replies.push(c)
    else if(!c.parent_id) roots.push(c)
  })

  const list=document.getElementById('commentsList')
  if(roots.length===0){
    list.innerHTML='<div class="empty-state">No comments yet. Be the first to reply!</div>'
  } else {
    list.innerHTML=roots.map(c=>renderComment(c,0)).join('')
  }
  // update count
  const el=document.getElementById('commentsCountLabel')
  if(el) el.textContent=comments.length+' Comment'+(comments.length!==1?'s':'')
}

async function init(){
  // get post id from URL
  const params=new URLSearchParams(window.location.search)
  postId=parseInt(params.get('id'))
  if(!postId||isNaN(postId)){
    document.getElementById('postArea').innerHTML='<div class="not-found"><h2>Post not found</h2><p style="color:var(--text3);margin:.5rem 0 1.5rem">This post may have been deleted or doesn\'t exist.</p><a href="/community" style="color:var(--c1);text-decoration:none">← Back to Community</a></div>'
    return
  }

  // record view (upsert = one per user)
  sb.from('post_views').upsert({post_id:postId,viewer_id:currentUser?.id||null},{onConflict:'post_id,viewer_id',ignoreDuplicates:true})

  // load post
  const{data:p,error}=await sb.from('posts_with_author').select('*').eq('id',postId).single()
  if(error||!p){
    document.getElementById('postArea').innerHTML='<div class="not-found"><h2>Post not found</h2><p style="color:var(--text3);margin:.5rem 0 1.5rem">This post may have been deleted.</p><a href="/community" style="color:var(--c1);text-decoration:none">← Back to Community</a></div>'
    return
  }
  postData=p

  // check my reaction to post
  let myR=null
  if(currentUser){
    const{data:r}=await sb.from('reactions').select('reaction').eq('user_id',currentUser.id).eq('target_type','post').eq('target_id',postId).single()
    if(r) myR=r.reaction
  }
  myReaction=myR

  document.getElementById('postArea').innerHTML=renderPost(p, myR)

  // render comments section
  document.getElementById('commentsArea').innerHTML=`
    <div class="comments-section">
      <div class="comments-header">
        <div class="comments-title" id="commentsCountLabel">Comments</div>
      </div>
      ${currentUser
        ? renderCommentBox(null, null)
        : `<div class="sign-in-prompt">💬 <span><a href="/login">Sign in</a> to join the discussion</span></div>`
      }
      <div id="commentsList"><div class="loading-comments">Loading comments…</div></div>
    </div>`

  await loadComments()
}
</script>
