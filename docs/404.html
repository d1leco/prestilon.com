<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="prestilon.logo.png">
    <title>PRESTILON</title>
    <script>
      // GitHub Pages SPA redirect trick
      // Encodes the full path into the query string so index.html can restore it
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1).join('/') +
        '/?p=' + encodeURIComponent(l.pathname + l.search) +
        (l.hash || '')
      );
    </script>
  </head>
  <body>
<!-- ═══ PRESTILON AI CHAT BUTTON ═══ -->
<style>
.ai-fab{
  position:fixed;bottom:70px;right:1.5rem;z-index:997;
  width:52px;height:52px;border-radius:16px;border:none;
  background:linear-gradient(135deg,#00d4b4,#6c5ce7);
  box-shadow:0 4px 24px rgba(0,212,180,.38),0 0 0 1px rgba(0,212,180,.2);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .22s;text-decoration:none;
}
.ai-fab:hover{transform:translateY(-3px) scale(1.06);box-shadow:0 8px 36px rgba(0,212,180,.55),0 0 0 1px rgba(0,212,180,.35)}
.ai-fab-icon{font-size:1.35rem;line-height:1;pointer-events:none}
.ai-fab-tooltip{
  position:absolute;right:60px;top:50%;transform:translateY(-50%);
  background:rgba(6,15,26,.96);border:1px solid rgba(0,212,180,.25);
  color:#f0f6ff;font-family:'DM Sans',sans-serif;font-size:.72rem;font-weight:600;
  padding:.3rem .65rem;border-radius:8px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .18s;
  box-shadow:0 4px 18px rgba(0,0,0,.4);
}
.ai-fab:hover .ai-fab-tooltip{opacity:1}
.ai-fab-badge{
  position:absolute;top:-4px;right:-4px;
  width:16px;height:16px;border-radius:50%;
  background:#00d4b4;border:2px solid #060f1a;
  display:flex;align-items:center;justify-content:center;
  font-size:.55rem;font-weight:800;color:#060f1a;font-family:'DM Sans',sans-serif;
}
@keyframes _fabpulse{0%,100%{box-shadow:0 4px 24px rgba(0,212,180,.38),0 0 0 1px rgba(0,212,180,.2)}50%{box-shadow:0 4px 32px rgba(0,212,180,.55),0 0 0 4px rgba(0,212,180,.08)}}
.ai-fab{animation:_fabpulse 3s ease-in-out infinite}
.ai-fab:hover{animation:none}
</style>
<a class="ai-fab" href="/chat" title="AI Assistant">
  <span class="ai-fab-icon">🧠</span>
  <span class="ai-fab-tooltip">AI Assistant</span>
  <span class="ai-fab-badge">AI</span>
</a>
<!-- ═══════════════════════════════ -->

</body>
</html>
