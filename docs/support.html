<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="description" content="PRESTILON Support — Get help with setup, diagnostics, and billing."/>
<title>Support — PRESTILON</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060f1a;--bg2:#0a1929;--bg3:#0e2035;
  --c1:#00d4b4;--c2:#00a896;--purple:#6c5ce7;
  --text:#f0f6ff;--text2:#8eaabf;--text3:#3d5a70;
  --border:rgba(255,255,255,.07);--border2:rgba(0,212,180,.25);
  --red:#ef4444;--green:#10d48a;--amber:#f59e0b;
  --r:max(1.5rem,calc(50vw - 640px));
}
html{background:var(--bg);scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;color:var(--text);overflow-x:hidden;min-height:100vh}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 70% 40% at 50% -5%,rgba(0,212,180,.06),transparent 55%),
  radial-gradient(ellipse 50% 50% at 90% 90%,rgba(108,92,231,.04),transparent 55%)}
canvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.3}

@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes shimmer{to{background-position:200% center}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
@keyframes _sp{to{transform:rotate(360deg)}}

/* NAV */
nav{
  position:sticky;top:0;z-index:999;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 1.5rem 0 0;
  height:64px;
  background:rgba(6,15,26,.9);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-bottom:1px solid var(--border);
}
.logo{display:flex;align-items:center;text-decoration:none;transition:opacity .2s}
.logo:hover{opacity:.85}
.logo-img{height:120px;width:auto;mix-blend-mode:screen;display:block}
@media(max-width:640px){
  nav{padding:0 .75rem 0 0;height:52px}
  .logo-img{height:36px}
  .nl{font-size:.75rem;padding:.3rem .5rem}
  .nc{padding:.35rem .65rem;font-size:.72rem;margin-left:.2rem;white-space:nowrap}
}
.nav-r{display:flex;align-items:center;gap:.15rem}
.nl{padding:.42rem .85rem;color:var(--text2);font-size:.88rem;font-weight:500;text-decoration:none;border-radius:7px;transition:color .18s,background .18s}
.nl:hover{color:var(--text);background:rgba(255,255,255,.05)}
.nl.active{color:var(--c1)}
.nc{margin-left:.5rem;padding:.5rem 1.25rem;border-radius:8px;font-family:'DM Sans',sans-serif;font-weight:700;font-size:.88rem;background:var(--c1);color:#060f1a;text-decoration:none;box-shadow:0 0 18px rgba(0,212,180,.25);transition:all .2s;display:inline-flex;align-items:center;gap:.3rem}
.nc:hover{box-shadow:0 0 30px rgba(0,212,180,.45);transform:translateY(-1px)}

/* HERO */
.hero{
  text-align:center;padding:72px var(--r) 60px;
  position:relative;z-index:1;
}
.h-badge{
  display:inline-flex;align-items:center;gap:.45rem;
  padding:.28rem .85rem .28rem .5rem;border-radius:99px;
  border:1px solid var(--border2);background:rgba(0,212,180,.05);
  font-family:'JetBrains Mono',monospace;font-size:.67rem;letter-spacing:.08em;color:var(--c1);
  margin-bottom:1.5rem;animation:up .55s ease both;
}
.h-dot{width:6px;height:6px;border-radius:50%;background:var(--c1);box-shadow:0 0 7px var(--c1);animation:pulse 2s infinite}
.hero-h1{
  font-family:'Syne',sans-serif;font-weight:800;
  font-size:clamp(2rem,4.5vw,3.2rem);line-height:1.1;letter-spacing:-.025em;
  margin-bottom:.9rem;animation:up .55s ease .07s both;
}
.hero-h1 .acc{background:linear-gradient(100deg,var(--c1),var(--purple),var(--c1));background-size:200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 6s linear infinite}
.hero-sub{color:var(--text2);font-size:.97rem;line-height:1.75;max-width:480px;margin:0 auto;animation:up .55s ease .14s both}

/* CONTENT GRID */
.content{
  padding:48px var(--r) 88px;
  position:relative;z-index:1;
  max-width:660px;margin:0 auto;
}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:1.8rem}
.card-title{font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;margin-bottom:.3rem;display:flex;align-items:center;gap:.5rem;color:var(--text)}
.card-sub{font-size:.8rem;color:var(--text2);margin-bottom:1.4rem;line-height:1.6}

/* FORM */
.fg{margin-bottom:.9rem}
.fl{display:block;font-size:.7rem;font-weight:600;color:var(--text2);margin-bottom:.36rem;letter-spacing:.02em;text-transform:uppercase}
.ff{width:100%;padding:.72rem 1rem;border-radius:10px;background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:'DM Sans',sans-serif;font-size:.88rem;transition:border-color .18s,box-shadow .18s;outline:none}
.ff:focus{border-color:rgba(0,212,180,.38);box-shadow:0 0 0 3px rgba(0,212,180,.06)}
.ff::placeholder{color:var(--text3)}
textarea.ff{resize:vertical;min-height:100px;line-height:1.65}
select.ff{cursor:pointer}
.fsub{width:100%;padding:.82rem;border-radius:10px;border:none;background:var(--c1);color:#060f1a;font-family:'DM Sans',sans-serif;font-size:.92rem;font-weight:800;cursor:pointer;transition:all .22s;box-shadow:0 0 22px rgba(0,212,180,.2);display:flex;align-items:center;justify-content:center;gap:.4rem;margin-top:.2rem}
.fsub:hover:not(:disabled){box-shadow:0 0 38px rgba(0,212,180,.4);transform:translateY(-1px)}
.fsub:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* ALERTS */
.albox{padding:.72rem .9rem;border-radius:9px;font-size:.79rem;margin-bottom:.85rem;display:flex;align-items:flex-start;gap:.42rem;line-height:1.5}
.ae{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.22);color:#fca5a5}
.as{background:rgba(16,212,138,.08);border:1px solid rgba(16,212,138,.22);color:#6ee7b7}
.spin{width:13px;height:13px;border:2px solid rgba(0,0,0,.15);border-top-color:#060f1a;border-radius:50%;animation:_sp .55s linear infinite;display:inline-block;flex-shrink:0}

/* SIDEBAR */
.sidebar{display:flex;flex-direction:column;gap:1.1rem;position:sticky;top:80px}

/* LINKS CARD */
.res-link{
  display:flex;align-items:center;gap:.75rem;text-decoration:none;
  padding:.65rem .8rem;border-radius:10px;border:1px solid var(--border);
  transition:border-color .2s,background .2s;margin-bottom:.5rem;
}
.res-link:last-child{margin-bottom:0}
.res-link:hover{border-color:var(--border2);background:rgba(0,212,180,.03)}
.rl-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0}
.rl-t{font-size:.82rem;font-weight:600;color:var(--text)}
.rl-s{font-size:.67rem;color:var(--text2);font-family:'JetBrains Mono',monospace}
.rl-arr{margin-left:auto;color:var(--text3);font-size:.8rem;flex-shrink:0}

/* INFO BOX */
.info-box{
  background:rgba(0,212,180,.04);border:1px solid var(--border2);border-radius:14px;
  padding:1.3rem 1.4rem;
}
.info-box p{font-size:.8rem;color:var(--text2);line-height:1.7;margin-bottom:1rem}
.info-box a{color:var(--c1);text-decoration:none;font-weight:600;font-size:.8rem}
.info-box a:hover{text-decoration:underline}

/* FOOTER */
footer{border-top:1px solid var(--border);padding:2rem var(--r);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;position:relative;z-index:1}
.fc{font-size:.7rem;color:var(--text3);margin-top:.2rem}
.fl-links{display:flex;gap:1.4rem;flex-wrap:wrap}
.fl-links a{color:var(--text3);text-decoration:none;font-size:.74rem;transition:color .2s}
.fl-links a:hover{color:var(--text2)}

/* REVEAL */
.rev{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s ease}
.rev.vis{opacity:1;transform:none}
</style>
</head>
<body>
<canvas id="bg"></canvas>

<nav>
  <a class="logo" href="/"><img class="logo-img" src="/prestilon.logo.png" alt="Prestilon"></a>
  <div class="nav-r">
    <a class="nl" href="/">Home</a>
    <a class="nl active" href="/support">Support</a>
    <a class="nc" id="navCta" href="/login">Sign In →</a>
  </div>
</nav>

<div class="hero">
  <div class="h-badge"><span class="h-dot"></span>HELP CENTER</div>
  <h1 class="hero-h1">How can we <span class="acc">help you?</span></h1>
  <p class="hero-sub">Send us a message and we'll get back to you within 24 hours on business days.</p>
</div>

<div class="content">
  <!-- CONTACT FORM -->
  <div class="card rev">
    <div class="card-title">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      Send a Message
    </div>
    <p class="card-sub">Describe your issue and we'll respond directly to your email.</p>
    <div id="cAlert"></div>
    <div class="fg"><label class="fl">Your name</label><input type="text" id="cName" class="ff" placeholder="Jane Doe"/></div>
    <div class="fg"><label class="fl">Email address</label><input type="email" id="cEmail" class="ff" placeholder="you@example.com"/></div>
    <div class="fg">
      <label class="fl">Topic</label>
      <select id="cTopic" class="ff">
        <option value="">Select a topic…</option>
        <option value="setup">Installation & Setup</option>
        <option value="diagnostics">Diagnostics & AI</option>
        <option value="billing">Billing & Subscription</option>
        <option value="license">License / Activation</option>
        <option value="bug">Bug Report</option>
        <option value="feature">Feature Request</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div class="fg"><label class="fl">Message</label><textarea id="cMsg" class="ff" rows="5" placeholder="Describe your issue in detail…"></textarea></div>
    <button class="fsub" id="sendBtn" onclick="sendMsg()">Send Message</button>
  </div>


</div>

<footer>
  <div class="fc">© 2026 PRESTILON. All rights reserved.</div>
</footer>

<script>
(()=>{
  const c=document.getElementById('bg'),x=c.getContext('2d');let W,H,P=[]
  function resize(){W=c.width=innerWidth;H=c.height=innerHeight}
  function init(){P=[];for(let i=0;i<45;i++)P.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.14,vy:(Math.random()-.5)*.14})}
  function draw(){
    x.clearRect(0,0,W,H)
    P.forEach((a,i)=>{
      P.slice(i+1).forEach(b=>{
        const dx=a.x-b.x,dy=a.y-b.y,d=Math.sqrt(dx*dx+dy*dy)
        if(d<110){x.beginPath();x.strokeStyle=`rgba(0,212,180,${.03*(1-d/110)})`;x.lineWidth=.5;x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}
      })
      x.beginPath();x.arc(a.x,a.y,1,0,Math.PI*2);x.fillStyle='rgba(0,212,180,.14)';x.fill()
      a.x+=a.vx;a.y+=a.vy
      if(a.x<0||a.x>W)a.vx*=-1;if(a.y<0||a.y>H)a.vy*=-1
    })
    requestAnimationFrame(draw)
  }
  window.addEventListener('resize',()=>{resize();init()})
  resize();init();draw()
})()

function sendMsg(){
  const n=document.getElementById('cName').value.trim()
  const e=document.getElementById('cEmail').value.trim()
  const t=document.getElementById('cTopic').value
  const m=document.getElementById('cMsg').value.trim()
  const al=document.getElementById('cAlert')
  const btn=document.getElementById('sendBtn')
  if(!n||!e||!t||!m){al.innerHTML='<div class="albox ae">Please fill in all fields.</div>';return}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)){al.innerHTML='<div class="albox ae">Please enter a valid email address.</div>';return}
  btn.disabled=true;btn.innerHTML='<span class="spin"></span> Sending…'
  setTimeout(()=>{
    btn.disabled=false;btn.innerHTML='Send Message'
    al.innerHTML='<div class="albox as">✅ Message sent! We\'ll reply within 24 hours.</div>'
    document.getElementById('cName').value=''
    document.getElementById('cEmail').value=''
    document.getElementById('cTopic').value=''
    document.getElementById('cMsg').value=''
  },1200)
}

const obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('vis')}),{threshold:.06})
document.querySelectorAll('.rev').forEach(el=>obs.observe(el))
</script>
