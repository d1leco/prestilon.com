<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PRESTIGE — Reset Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #030712;
      font-family: ui-sans-serif, system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .wrap { width: 100%; max-width: 380px; }
    .logo {
      display: flex; flex-direction: column; align-items: center; margin-bottom: 40px;
    }
    .logo-icon {
      width: 64px; height: 64px; border-radius: 16px;
      background: linear-gradient(135deg, #06b6d4, #2563eb);
      box-shadow: 0 0 40px rgba(6,182,212,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 700; color: #fff; margin-bottom: 16px;
    }
    .logo-title {
      font-family: 'Share Tech Mono', monospace;
      letter-spacing: 0.25em; font-size: 20px; font-weight: 700; color: #fff;
    }
    .card {
      background: rgba(17,24,39,0.9);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 32px;
    }
    .card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .card-icon {
      width: 40px; height: 40px; border-radius: 12px;
      background: rgba(6,182,212,0.1); border: 1px solid rgba(6,182,212,0.3);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .card-title { font-size: 18px; font-weight: 700; color: #fff; }
    .card-sub { font-size: 12px; color: #6b7280; margin-top: 2px; }
    .field {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px; border-radius: 12px;
      border: 1px solid rgba(55,65,81,0.6);
      background: rgba(17,24,39,0.8);
      margin-bottom: 12px;
    }
    .field input {
      flex: 1; background: transparent; color: #fff;
      font-size: 14px; border: none; outline: none;
    }
    .field input::placeholder { color: #6b7280; }
    .field svg { flex-shrink: 0; }
    .toggle { background: none; border: none; cursor: pointer; color: #6b7280; display: flex; padding: 0; }
    .btn {
      width: 100%; padding: 14px;
      border-radius: 12px; border: none; cursor: pointer;
      background: linear-gradient(135deg, #0891b2, #2563eb);
      color: #fff; font-weight: 600; font-size: 14px;
      box-shadow: 0 4px 20px rgba(6,182,212,0.2);
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 4px;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .error {
      display: none; align-items: flex-start; gap: 10px;
      padding: 12px 16px; border-radius: 12px; margin-top: 12px;
      background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2);
      color: #f87171; font-size: 14px;
    }
    .center-card { text-align: center; }
    .big-icon {
      width: 64px; height: 64px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
    }
    .title { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 8px; }
    .desc { font-size: 14px; color: #9ca3af; line-height: 1.5; }
    .hint { font-size: 12px; color: #6b7280; margin-top: 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 1s linear infinite; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="logo-icon">P</div>
    <div class="logo-title">PRESTIGE</div>
  </div>
  <div id="app"></div>
</div>

<script>
const SUPABASE_URL      = 'https://ryftlimrjhhoymyfzusq.supabase.co'
const SUPABASE_ANON_KEY = 'sb_publishable_NCaK6GQdtf7vuhyHPLs1Fw_wE89uJ86'
let accessToken = ''

function sbHeaders(token) {
  return {
    'Content-Type': 'application/json',
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': `Bearer ${token || SUPABASE_ANON_KEY}`,
  }
}

// ── Pages ──────────────────────────────────────────────────────

function showParsing() {
  document.getElementById('app').innerHTML = `
    <div class="card center-card">
      <svg class="spin" style="margin:0 auto 16px;display:block" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round">
        <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
      </svg>
      <p style="color:#9ca3af;font-size:14px">Verifying reset link...</p>
    </div>`
}

function showInvalid() {
  document.getElementById('app').innerHTML = `
    <div class="card center-card">
      <div class="big-icon" style="background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3)">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </div>
      <div class="title">Invalid link</div>
      <div class="desc">This password reset link is invalid or has already been used. Please request a new one.</div>
      <div class="hint">You can close this tab.</div>
    </div>`
}

function showExpired() {
  document.getElementById('app').innerHTML = `
    <div class="card center-card">
      <div class="big-icon" style="background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3)">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </div>
      <div class="title">Link expired</div>
      <div class="desc">This reset link has expired (valid for 1 hour). Please request a new password reset.</div>
      <div class="hint">You can close this tab.</div>
    </div>`
}

function showDone() {
  document.getElementById('app').innerHTML = `
    <div class="card center-card">
      <div class="big-icon" style="background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3)">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
      </div>
      <div class="title">Password updated!</div>
      <div class="desc">Your password has been changed successfully. You can now sign in with your new password.</div>
    </div>`
}

// ── Form — rendered once, NO dynamic updates while typing ──────

function showForm() {
  document.getElementById('app').innerHTML = `
    <div class="card">
      <div class="card-header">
        <div class="card-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <div>
          <div class="card-title">Set new password</div>
          <div class="card-sub">Secured by email confirmation</div>
        </div>
      </div>

      <div class="field">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <input id="pw" type="password" placeholder="New password" autocomplete="new-password" />
        <button class="toggle" id="tpw" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>

      <div class="field">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <input id="cf" type="password" placeholder="Confirm new password" autocomplete="new-password" />
        <button class="toggle" id="tcf" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>

      <button class="btn" id="sbtn" type="button">
        <span>Update Password</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
          <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
        </svg>
      </button>

      <div class="error" id="err">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2" style="flex-shrink:0;margin-top:2px">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="err-txt"></span>
      </div>
    </div>`

  // Toggle show/hide — does NOT affect input value or focus
  document.getElementById('tpw').onclick = () => {
    const i = document.getElementById('pw')
    i.type = i.type === 'text' ? 'password' : 'text'
  }
  document.getElementById('tcf').onclick = () => {
    const i = document.getElementById('cf')
    i.type = i.type === 'text' ? 'password' : 'text'
  }

  document.getElementById('sbtn').onclick = handleSubmit
}

function showError(msg) {
  const e = document.getElementById('err')
  e.style.display = 'flex'
  document.getElementById('err-txt').textContent = msg
}

async function handleSubmit() {
  const pw = document.getElementById('pw').value
  const cf = document.getElementById('cf').value
  const err = document.getElementById('err')
  err.style.display = 'none'

  if (pw.length < 8)  { showError('Password must be at least 8 characters'); return }
  if (pw !== cf)       { showError('Passwords do not match'); return }

  const btn = document.getElementById('sbtn')
  btn.disabled = true
  btn.innerHTML = `
    <svg class="spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
      <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
    </svg><span>Saving...</span>`

  try {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
      method: 'PUT',
      headers: sbHeaders(accessToken),
      body: JSON.stringify({ password: pw }),
    })
    if (!res.ok) {
      const j = await res.json().catch(() => ({}))
      showError(j.message || 'Failed to update password')
      btn.disabled = false
      btn.innerHTML = `<span>Update Password</span>`
      return
    }
    showDone()
  } catch {
    showError('Network error. Please try again.')
    btn.disabled = false
    btn.innerHTML = `<span>Update Password</span>`
  }
}

// ── Init ───────────────────────────────────────────────────────

;(async () => {
  const p     = new URLSearchParams(window.location.hash.substring(1))
  const type  = p.get('type')
  const token = p.get('access_token')
  const ref   = p.get('refresh_token')

  if (!token || type !== 'recovery') { showInvalid(); return }
  showParsing()

  try {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
      method: 'POST',
      headers: sbHeaders(),
      body: JSON.stringify({ refresh_token: ref }),
    })
    if (!res.ok) { showExpired(); return }
    const data = await res.json()
    accessToken = data.access_token || token
    window.history.replaceState(null, '', window.location.pathname)
    showForm()
  } catch {
    showExpired()
  }
})()
</script>
</body>
</html>
